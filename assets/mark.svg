<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="SeKondBrain">
  <defs>
    <linearGradient id="sphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A8AF6"/>
      <stop offset="55%" stop-color="#8B78F5"/>
      <stop offset="1" stop-color="#E24AF2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A8AF6"/>
      <stop offset="45%" stop-color="#8B78F5"/>
      <stop offset="75%" stop-color="#E24AF2"/>
      <stop offset="1" stop-color="#F28B68"/>
    </linearGradient>
  </defs>
  <!-- aurora ring: 290deg arc, gap at top-left -->
  <path d="M20 3.6a16.4 16.4 0 1 1-11.6 4.8" fill="none" stroke="url(#ring)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- sphere: the dense centre -->
  <circle cx="20" cy="20" r="9.4" fill="url(#sphere)"/>
  <!-- three lilac dots entering the orbit through the gap -->
  <circle cx="8.4" cy="11.6" r="1.5" fill="#A88AF8"/>
  <circle cx="11.4" cy="8.2" r="1.5" fill="#A88AF8"/>
  <circle cx="14.6" cy="5.2" r="1.5" fill="#A88AF8"/>
</svg>
